name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rebrand-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Check rebrand leakage
        run: bash scripts/ci/check-rebrand-leakage.sh

  zombie-import-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check zombie imports
        run: node scripts/check-no-zombie-imports.mjs

  stub-debt-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check stub debt
        run: node scripts/check-stub-debt.mjs

  throwing-stub-callers-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Self-test classifier (fixture-based)
        run: node scripts/check-throwing-stub-callers.mjs --self-test

      - name: Check throwing-stub-with-live-callers
        run: node scripts/check-throwing-stub-callers.mjs

  attestation-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Self-test classifier (fixture-based)
        run: node scripts/check-attestations.mjs --self-test

      - name: Check module attestations
        run: node scripts/check-attestations.mjs

  obsolescence-audit-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check obsolescence audit
        run: node scripts/check-obsolescence-audit.mjs

  policy-doctor-boundary-gate:
    # Structural security gate for the policy-doctor bounded-write boundary
    # (PR #2895): detect is pure-read, the repair reducer does no I/O, the ext
    # exposes exactly one repair(), and the core wiring gates repair behind
    # `--fix` + mode:"fix". The rationale home
    # (src/commands/doctor-policy-checks.boundary.test.ts) lives under
    # src/commands/**, which is DELIBERATELY excluded from every fork vitest lane,
    # so this standalone gate re-homes the invariant as a required CI check without
    # reversing that exclusion. See § Fork-integrity gates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Self-test detector (planted violation must fail)
        run: node scripts/check-policy-doctor-boundary.mjs --self-test

      - name: Check policy-doctor bounded-write boundary
        run: node scripts/check-policy-doctor-boundary.mjs

  raw-channel-fetch-gate:
    # Security lint for the fork's most-exposed surface: channel/plugin runtime
    # code must route outbound calls through fetchWithSsrFGuard() (DNS-pinned
    # host, redirect:"manual", per-hop re-validation) rather than raw fetch(),
    # except for callsites on the reviewed ledger in the script. The gate
    # existed but ran in no CI job, so it never fired and its ledger rotted
    # unnoticed (#3055). See § Fork-integrity gates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check raw channel fetch callsites
        run: node scripts/check-no-raw-channel-fetch.mjs

  plugin-inventory-gate:
    # docs/plugins/plugin-inventory.md, docs/plugins/reference.md, and
    # docs/plugins/reference/*.md are generated from extensions/*/package.json +
    # remoteclaw.plugin.json. The generator shipped a --check mode from upstream
    # but ran in no CI lane, so the committed inventory drifted to 129 entries
    # (101 of them naming plugins this fork does not ship, each asserting
    # "included in RemoteClaw" under an unregistered @remoteclaw/* name — the
    # #3075 surface) while 89 reference pages sat orphaned. PR #3082 deleted
    # extensions/raft and passed every lane green with the inventory still
    # linking the removed page. See #3084 and § Fork-integrity gates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check generated plugin inventory
        run: pnpm plugins:inventory:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check
        run: pnpm check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build
        run: pnpm build

      - name: Validate release artifact (early signal — runs again in publish-next)
        run: pnpm release:check

  packaged-boot-smoke:
    # Installs the packed npm tarball into an isolated consumer OUTSIDE the repo
    # checkout and boots `remoteclaw plugins doctor`, failing if any bundled
    # plugin fails to load. Guards the sync #2762 regression class: the build
    # emitted the plugin-sdk root alias (dist/plugin-sdk/root-alias.cjs) but not
    # the concrete per-subpath dist files it resolves against, so the published
    # package booted with ZERO plugins (`Cannot find module
    # '.../root-alias.cjs/text-runtime'`). Neither `pnpm build` nor
    # `pnpm release:check` exercises the installed package's runtime plugin
    # loader, so this is a distinct required gate. The consumer must be isolated
    # OUTSIDE the checkout or Node resolution climbs into the repo's own built
    # dist and masks a broken tarball (see the script header).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build
        run: pnpm build

      - name: Packaged plugin-boot smoke test
        run: bash scripts/ci/check-packaged-plugin-boot.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build canvas bundle
        run: pnpm canvas:a2ui:bundle

      - name: Test
        run: pnpm test
        env:
          REMOTECLAW_TEST_WORKERS: 1
          REMOTECLAW_TEST_MAX_OLD_SPACE_SIZE_MB: 1536

  test-gateway:
    # Full gateway behavioral suite — src/gateway/**/*.test.ts (~140 files,
    # ~1,560 tests). Runs on its own runner, in parallel with `test`, and is
    # aggregated through the `CI` rollup so a gateway regression blocks merge
    # (#2720). Kept separate from `pnpm test` because the suite is global-state
    # and ephemeral-port (port 0) sensitive: it is run serially
    # (--no-file-parallelism) for determinism, mirroring the local invocation
    # it was validated green against. Folding it into `test` would serialize it
    # onto that job's critical path with no isolation benefit. Supersedes the
    # former single-file `test-gateway-preauth` lane — the full suite subsumes
    # server.preauth-hardening.test.ts (#2644), which matches the glob above.
    runs-on: ubuntu-latest
    # Hard backstop: a hung gateway server (unreleased port, stalled connect)
    # must fail fast, not hold the runner for the 6h job default.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build canvas bundle
        run: pnpm canvas:a2ui:bundle

      - name: Run gateway behavioral suite
        run: pnpm exec vitest run --config vitest.gateway.config.ts --pool=forks --no-file-parallelism
        env:
          REMOTECLAW_TEST_INCLUDE_GATEWAY: "1"

  test-extensions:
    # Full extensions suite — extensions/**/*.test.ts: every channel adapter
    # (BlueBubbles, Discord, Telegram, Slack, WhatsApp, iMessage, …) plus
    # extension-side auto-reply handlers. Runs on its own runner, in parallel
    # with `test`, and is aggregated through the `CI` rollup so a channel-adapter
    # regression blocks merge (#2779 — the coverage gap that let #2775 ship
    # broken). `pnpm test` (unit config) explicitly excludes extensions/**, so
    # without this lane the whole tree merges unseen. Currently-failing files are
    # quarantined in vitest.quarantine.ts so the lane is required-and-green; NEW
    # breakage in any non-quarantined (or newly-added) file still fails here.
    runs-on: ubuntu-latest
    # Large suite; a hung adapter suite must fail fast, not hold the runner.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build canvas bundle
        run: pnpm canvas:a2ui:bundle

      - name: Run extensions suite
        run: pnpm exec vitest run --config vitest.extensions.config.ts
        env:
          REMOTECLAW_TEST_INCLUDE_EXTENSIONS: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"

  test-auto-reply:
    # Repo-root auto-reply suite — src/auto-reply/**/*.test.ts. Runs on its own
    # runner, aggregated through the `CI` rollup so an auto-reply regression
    # blocks merge (#2779). `pnpm test` (unit config) explicitly excludes
    # src/auto-reply/**, so without this lane it merges unseen. Extension-side
    # auto-reply handlers live under extensions/** and are covered by the
    # `test-extensions` lane, keeping the two lanes non-overlapping. Currently-
    # failing files are quarantined in vitest.quarantine.ts so the lane is
    # required-and-green.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build canvas bundle
        run: pnpm canvas:a2ui:bundle

      - name: Run auto-reply suite
        run: pnpm exec vitest run --config vitest.auto-reply.config.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  test-ui-smoke:
    # Browser-mode smoke lane for the RemoteClawApp host class. Scoped to
    # the two sync-regression defense-in-depth suites — class-instance
    # presence (#2495 / #2496) and computed-style layout (#2519). Kept
    # separate from `pnpm test` because (a) browser-mode needs a real
    # browser binary and (b) the rest of `ui/**/*.test.ts` has out-of-scope
    # failures tracked separately from the sync-regression class.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Resolve Playwright version
        id: pw-version
        run: |
          echo "version=$(pnpm --dir ui exec playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        # Cache the downloaded browser bundle so the flaky cdn.playwright.dev
        # download (#2684) is skipped on the common path (cache hit). Keyed on
        # the resolved Playwright version so a version bump invalidates cleanly.
        # First run on a new version is a miss (the install step below seeds it);
        # every subsequent run restores from cache and skips the CDN entirely.
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        # Cache-miss populator + on-hit no-op (browser already present from the
        # cache step above); always runs `--with-deps` to ensure OS deps. Bound +
        # retry the install so a transient Playwright-CDN or apt stall fails fast
        # and self-heals instead of holding the runner for the 6h job default
        # (#2684). Each attempt is capped by `timeout`; step-level
        # timeout-minutes is the hard backstop.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            echo "::group::playwright install (attempt ${attempt}/3)"
            if timeout --kill-after=30s 4m pnpm --dir ui exec playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::playwright install attempt ${attempt}/3 did not succeed"
            if [ "${attempt}" -lt 3 ]; then
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::playwright Chromium install failed after 3 attempts"
          exit 1

      - name: UI smoke tests (browser-mode)
        run: pnpm test:ui:smoke

  test-windows:
    # The project's FIRST Windows runner. README.md advertises a Windows install
    # path (`irm https://remoteclaw.ps | iex`) while every other `runs-on:` in this
    # directory is Ubuntu, so Windows-targeted work has been merging on static
    # reasoning alone (#3088, #3116) against a resolver census whose own header
    # documents a mutation-proven blind spot.
    #
    # A NARROW SPIKE, deliberately not a full-suite port: 397 of 2,302 tracked
    # `*.test.ts` files hardcode POSIX absolute paths (2,184 occurrences), so a
    # `pnpm test` here could only ever be red. The membership rule and the
    # per-file exclusions live in `vitest.windows.config.ts` — that file, not this
    # job, is where widening the lane gets reviewed.
    #
    # NOT WIRED INTO THE `CI` ROLLUP, on purpose: this lane is one PR old and has
    # no flake history on a runner class this repo has never used. It runs on every
    # PR and is visible in the checks list, but it does not block merge yet.
    # Promoting it is a two-line change — add `test-windows` to the rollup's
    # `needs:` AND to its result-check condition. Both, or neither: `needs:` alone
    # makes the rollup wait on a job whose failure it then ignores, and the
    # condition alone evaluates `needs.test-windows.result` to empty and blocks
    # every merge permanently.
    #
    # No `pnpm canvas:a2ui:bundle` step: verified that none of the included suites
    # import the bundle (the lane passes with `vendor/a2ui/renderers/lit/dist`
    # absent). Add it here if the include list ever grows into canvas territory.
    runs-on: windows-latest
    # A hung child process on a first-time runner class must fail fast, not hold
    # the runner for the 6h job default.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      # Cheap (~5s locally) and genuinely platform-sensitive: case-insensitive
      # path resolution surfaces import-casing bugs that Ubuntu never sees.
      # `pnpm build` is deliberately NOT run — it is heavy and its Windows signal
      # is not established yet.
      - name: Typecheck
        shell: bash
        run: pnpm tsgo

      - name: Windows-relevant suites
        shell: bash
        run: pnpm test:windows

  CI:
    if: always()
    needs:
      [
        rebrand-gate,
        zombie-import-gate,
        stub-debt-gate,
        throwing-stub-callers-gate,
        obsolescence-audit-gate,
        policy-doctor-boundary-gate,
        raw-channel-fetch-gate,
        plugin-inventory-gate,
        lint,
        build,
        packaged-boot-smoke,
        test,
        test-gateway,
        test-extensions,
        test-auto-reply,
        test-ui-smoke,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rebrand-gate.result }}" != "success" || "${{ needs.zombie-import-gate.result }}" != "success" || "${{ needs.stub-debt-gate.result }}" != "success" || "${{ needs.throwing-stub-callers-gate.result }}" != "success" || "${{ needs.obsolescence-audit-gate.result }}" != "success" || "${{ needs.policy-doctor-boundary-gate.result }}" != "success" || "${{ needs.raw-channel-fetch-gate.result }}" != "success" || "${{ needs.plugin-inventory-gate.result }}" != "success" || "${{ needs.lint.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.packaged-boot-smoke.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.test-gateway.result }}" != "success" || "${{ needs.test-extensions.result }}" != "success" || "${{ needs.test-auto-reply.result }}" != "success" || "${{ needs.test-ui-smoke.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi

  publish-next:
    if: github.event_name == 'push'
    # packaged-boot-smoke gates publish directly (not only via the CI rollup):
    # this job runs in parallel with CI on push, so without the dependency a
    # broken canary could ship even as the rollup fails. It is the exact failure
    # mode #2762 hit — a published package that boots zero plugins.
    needs: [lint, build, packaged-boot-smoke, test]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Configure npm registry
        uses: actions/setup-node@v6
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: pnpm build

      - name: Stamp next version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TS=$(date -u +%Y%m%d%H%M%S)
          NEXT_VERSION="${PKG_VERSION}-next.${BUILD_TS}.${SHORT_SHA}"
          npm version "$NEXT_VERSION" --no-git-tag-version

      - name: Sync extension versions
        run: pnpm plugins:sync-version

      - name: Validate release artifacts
        run: pnpm release:check

      - name: Publish next
        run: npm publish --tag next --provenance --access public

  publish-latest:
    if: github.event_name == 'release'
    # See publish-next: gate the published artifact on the packaged plugin-boot
    # smoke test so a package that boots zero plugins can never be released.
    needs: [lint, build, packaged-boot-smoke, test]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Configure npm registry
        uses: actions/setup-node@v6
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Stamp version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Release tag: $TAG (version: $VERSION)"
          echo "package.json version: $PKG_VERSION"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::notice::Stamping version from tag: $PKG_VERSION → $VERSION"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm build

      - name: Sync extension versions
        run: pnpm plugins:sync-version

      - name: Validate release artifacts
        run: pnpm release:check

      - name: Publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --provenance --tag beta --access public
          else
            npm publish --provenance --access public
          fi
